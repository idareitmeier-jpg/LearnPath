<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LearnPath</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    nav button {
      background: white;
      color: #2563eb;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 15px;
      cursor: pointer;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 15px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button.primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .success {
      color: #16a34a;
      margin-top: 10px;
      font-weight: bold;
    }

    .plan {
      border-left: 5px solid #2563eb;
      padding: 15px;
      background: #eff6ff;
      border-radius: 8px;
      margin-top: 15px;
    }

    .stat {
      padding: 15px;
      background: #f8fafc;
      border-radius: 10px;
      margin: 10px 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>📚 LearnPath</h1>

  <nav>
    <button onclick="showPage('overview')">Übersicht</button>
    <button onclick="showPage('plan')">Lernplan</button>
    <button onclick="showPage('cards')">Karteikarten</button>
    <button onclick="showPage('profile')">Profil</button>
  </nav>
</header>

<main>

  <!-- ÜBERSICHT -->
  <section id="overview" class="page active">
    <div class="card">
      <h2>Willkommen bei LearnPath! 👋</h2>
      <p>Erstelle deinen persönlichen Lernplan für deine nächste Prüfung.</p>
    </div>

    <div class="card">
      <h2>Dein aktueller Lernplan</h2>

      <div class="stat">
        📚 Fach: <strong id="overviewSubject">Noch nicht erstellt</strong>
      </div>

      <div class="stat">
        🎯 Wunschnote: <strong id="overviewGoal">–</strong>
      </div>

      <div class="stat">
        📅 Tage bis zur Prüfung: <strong id="overviewDays">–</strong>
      </div>

      <div class="stat">
        ⏱️ Tägliche Lernzeit: <strong id="overviewMinutes">–</strong>
      </div>

      <div class="stat">
        🔥 Empfehlung: <strong id="overviewIntensity">–</strong>
      </div>
    </div>
  </section>


  <!-- LERNPLAN -->
  <section id="plan" class="page">

    <div class="card">
      <h2>📝 Lernplan erstellen</h2>

      <label>Fach</label>
      <input id="subject" placeholder="z. B. Mathematik">

      <label>Prüfungsdatum</label>
      <input id="examDate" type="date">

      <label>Wunschnote</label>
      <select id="goalGrade">
        <option value="">Bitte auswählen</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>

      <label>Minuten pro Tag</label>
      <input id="minutes" type="number" placeholder="z. B. 45">

      <button class="primary" onclick="createPlan()">
        Lernplan erstellen
      </button>

      <div id="planResult"></div>
    </div>

  </section>


  <!-- KARTEIKARTEN -->
  <section id="cards" class="page">

    <div class="card">
      <h2>🗂️ Karteikarten</h2>

      <label>Frage</label>
      <input id="cardQuestion" placeholder="Deine Frage">

      <label>Antwort</label>
      <input id="cardAnswer" placeholder="Die Antwort">

      <button class="primary" onclick="addCard()">
        Karteikarte speichern
      </button>
    </div>

    <div id="cardList"></div>

  </section>


  <!-- PROFIL -->
  <section id="profile" class="page">

    <div class="card">
      <h2>👤 Dein Profil</h2>

      <label>Name</label>
      <input id="userName" placeholder="Dein Name">

      <label>Schulart</label>
      <input id="schoolType" placeholder="z. B. Gymnasium">

      <label>Klassenstufe</label>
      <input id="gradeLevel" placeholder="z. B. 8">

      <button class="primary" onclick="saveProfile()">
        Profil speichern
      </button>

      <p id="profileStatus" class="success"></p>
    </div>

  </section>

</main>


<script>

  /* =====================================================
     SUPABASE DATEN
     HIER DEINE EIGENEN WERTE EINFÜGEN
     ===================================================== */

  const SUPABASE_URL = "https://varkcelgcnlrvolrhhio.supabase.co";

  const SUPABASE_KEY = "sb_publishable_KzA3gdL3LeerPPhyUQJaPw_z3S450VG";


  /* =====================================================
     SEITEN
     ===================================================== */

  function showPage(pageId) {

    document.querySelectorAll(".page").forEach(page => {
      page.classList.remove("active");
    });

    document.getElementById(pageId).classList.add("active");

  }


  /* =====================================================
     PROFIL
     ===================================================== */

  function saveProfile() {

    const profile = {
      name: document.getElementById("userName").value,
      schoolType: document.getElementById("schoolType").value,
      gradeLevel: document.getElementById("gradeLevel").value
    };

    localStorage.setItem(
      "learnpathProfile",
      JSON.stringify(profile)
    );

    document.getElementById("profileStatus").textContent =
      "✅ Profil gespeichert!";

  }


  function loadProfile() {

    const savedProfile =
      JSON.parse(localStorage.getItem("learnpathProfile"));

    if (savedProfile) {

      document.getElementById("userName").value =
        savedProfile.name || "";

      document.getElementById("schoolType").value =
        savedProfile.schoolType || "";

      document.getElementById("gradeLevel").value =
        savedProfile.gradeLevel || "";

    }

  }


  /* =====================================================
     LERNPLAN
     ===================================================== */

  function createPlan() {

    const subject =
      document.getElementById("subject").value;

    const examDate =
      document.getElementById("examDate").value;

    const goal =
      document.getElementById("goalGrade").value;

    const minutes =
      document.getElementById("minutes").value;


    if (!subject || !examDate || !goal || !minutes) {

      alert("Bitte fülle alle Felder aus.");

      return;

    }


    const today = new Date();

    const exam = new Date(examDate);

    const difference = exam - today;

    const days =
      Math.ceil(difference / (1000 * 60 * 60 * 24));


    if (days < 1) {

      alert("Bitte wähle ein zukünftiges Prüfungsdatum.");

      return;

    }


    let intensity;

    if (goal <= 2) {

      intensity = "Intensives Lernen empfohlen";

    } else {

      intensity = "Regelmäßiges Lernen empfohlen";

    }


    const plan = {
      subject: subject,
      examDate: examDate,
      goal: goal,
      minutes: minutes,
      days: days,
      intensity: intensity
    };


    localStorage.setItem(
      "learnpathPlan",
      JSON.stringify(plan)
    );


    document.getElementById("planResult").innerHTML = `
      <div class="plan">
        <h3>🎉 Dein Lernplan</h3>

        <p>📚 <strong>Fach:</strong> ${subject}</p>

        <p>🎯 <strong>Wunschnote:</strong> ${goal}</p>

        <p>📅 <strong>Tage bis zur Prüfung:</strong> ${days}</p>

        <p>⏱️ <strong>Tägliche Lernzeit:</strong> ${minutes} Minuten</p>

        <p>🔥 <strong>Empfehlung:</strong> ${intensity}</p>
      </div>
    `;


    updateOverview();

    showPage("overview");

  }


  /* =====================================================
     ÜBERSICHT
     ===================================================== */

  function updateOverview() {

    const plan =
      JSON.parse(localStorage.getItem("learnpathPlan"));


    if (!plan) return;


    document.getElementById("overviewSubject").textContent =
      plan.subject;

    document.getElementById("overviewGoal").textContent =
      plan.goal;

    document.getElementById("overviewDays").textContent =
      plan.days;

    document.getElementById("overviewMinutes").textContent =
      plan.minutes + " Minuten";

    document.getElementById("overviewIntensity").textContent =
      plan.intensity;

  }


  /* =====================================================
     KARTEIKARTEN
     ===================================================== */

  function addCard() {

    const question =
      document.getElementById("cardQuestion").value;

    const answer =
      document.getElementById("cardAnswer").value;


    if (!question || !answer) {

      alert("Bitte Frage und Antwort eingeben.");

      return;

    }


    let cards =
      JSON.parse(localStorage.getItem("learnpathCards")) || [];


    cards.push({
      question: question,
      answer: answer
    });


    localStorage.setItem(
      "learnpathCards",
      JSON.stringify(cards)
    );


    document.getElementById("cardQuestion").value = "";

    document.getElementById("cardAnswer").value = "";


    renderCards();

  }


  function renderCards() {

    const cards =
      JSON.parse(localStorage.getItem("learnpathCards")) || [];


    const cardList =
      document.getElementById("cardList");


    cardList.innerHTML = "";


    cards.forEach((card, index) => {

      cardList.innerHTML += `
        <div class="card">
          <h3>Frage ${index + 1}</h3>

          <p>${card.question}</p>

          <br>

          <strong>Antwort:</strong>

          <p>${card.answer}</p>
        </div>
      `;

    });

  }


  /* =====================================================
     START
     ===================================================== */

  loadProfile();

  updateOverview();

  renderCards();
  
  

</script>

</body>
</html>
